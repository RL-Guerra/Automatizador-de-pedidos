<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.3.0/uicons-brands/css/uicons-brands.css'>
    <link rel="icon" href="img/icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <script src="script/script.js" defer></script>
    <title>CRDOCES</title>
</head>
<body>
    <!-- Página Inicial -->
    <section id="home">
        <img id="logo" src="img/CRDOCESLOGO.jpg" alt="Logo da CRDOCES">
        <h1>Bem-vindo à página de pedidos da CRDOCES!</h1>
        <p>Feito com muito amor.</p>
        <button onclick="showOrderForm()">Faça seu Pedido</button>
    </section>

    <!-- Página de Pedidos -->
    <section id="order" style="display: none;">
        <h2>Faça seu Pedido</h2>

        <!-- Escolha do Sabor -->
        <label for="flavor">Escolha o sabor:</label>
        <select id="flavor">
            <!-- 75 KG -->
            <option value="morango">Mouse de Morango (R$ 75/kg)</option>
            <option value="maracuja">Mouse de Maracujá (R$ 75/kg)</option>
            <option value="limao">Mouse de Limão (R$ 75/kg)</option>
            <option value="chocolate">Mouse de Chocolate (R$ 75/kg)</option>
            <option value="brigadeiro">Brigadeiro (R$ 75/kg)</option>
            <option value="ninho">Brigadeiro de Ninho (R$ 75/kg)</option>
            <option value="bichoDePe">Brigadeiro de Morango(Bicho de Pé) (R$ 75/kg)</option>
            <option value="laka">Brigadeiro Laka (R$ 75/kg)</option>
            <option value="beijinho"> Beijinho/Prestigio (R$ 75/kg)</option>
            <option value="doceDeLeiteComCoco">Doce de Leite Com Coco(R$ 75/kg)</option>
            <option value="doceDeLeiteSemCoco">Doce de Leite Sem Coco(R$ 75/kg)</option>
            <!-- 80 KG -->
            <option value="brigadeiroComMorango">Brigadeiro com Morango (R$ 80/kg)</option>
            <option value="cremeBelgaComMorango">Creme Belga com Morango (R$ 80/kg)</option>
            <option value="cremeBelgaComAbacaxi">Creme Belga com Abacaxi (R$ 80/kg)</option>
            <option value="cremeBelgaComPessego">Creme Belga com Pêssego (R$ 80/kg)</option>
            <option value="brigadeiroDeNinhoComMorango">Brigadeiro de Ninho com Morango (R$ 80/kg)</option>
            <option value="brigadeiroDeNinhoComAbacaxi">Brigadeiro de Ninho com Abacaxi (R$ 80/kg)</option>
            <option value="doceDeLeiteComMorango">Doce de Leite com Morango (R$ 80/kg)</option>
            <option value="doceDeLeiteComAbacaxi">Doce de Leite com Abacaxi (R$ 80/kg)</option>
            <option value="brigadeiroLakaComMorango">Brigadeiro Laka com Morango (R$ 80/kg)</option>
            <option value="trufadoAlpinoMeioAmargo">Trufado Meio Amargo (R$ 80/kg)</option>
            <option value="trufadoAlpinoAoLeite">Trufado ao Leite (R$ 80/kg)</option>
            <option value="doisAmores">Dois Amores (Brigadeiro Branco e Preto) (R$ 80/kg)</option>
            <option value="CremeMocaComMorango">Creme Moça com Morango (R$ 80/kg)</option>
            <!-- 85 KG -->
            <option value="brigadeiroDeNinhoComNutella">Brigadeiro de Ninho com Nutella (R$ 85/kg)</option>
            <option value="brigadeiroDeNutella">Brigadeiro de Nutella (R$ 85/kg)</option>
            <option value="doceDeLeiteComNozes">Doce de Leite com Nozes (R$ 85/kg)</option>
            <option value="doceDeLeiteComAmeixa">Doce de Leite com Ameixa (R$ 85/kg)</option>
            <option value="florestaNegra">Floresta Negra (R$ 85/kg)</option>
            <option value="florestaBranca">Floresta Branca (R$ 85/kg)</option>
            <option value="brigadeiroDeNozes">Brigadeiro de Nozes (R$ 85/kg)</option>
            <option value="trufadoBrancoLimao">Trufado Branco com Limão (R$ 85/kg)</option>
            <option value="trufadoBrancoMaracuja">Trufado Branco com Maracujá (R$ 85/kg)</option>
            <option value="trufadoChocolateComCereja">Trufado Chocolate com Cereja (R$ 85/kg)</option>
            <option value="trufadoChocolateComMorango">Trufado Chocolate com Morango (R$ 85/kg)</option>
        </select>

        <!-- Escolha do Formato -->
        <label for="shape">Escolha o formato:</label>
        <select id="shape">
            <option value="redondo">Redondo</option>
            <option value="quadrado">Quadrado</option>
        </select>

        <!-- Quantidade de Quilos -->
        <label for="weight">Quantidade de quilos:</label>
        <input style="text-align: center;" type="number" id="weight" min="1" max="25" value="1">

        <!-- Decoração Personalizada -->
        <label for="decoration">Decoração personalizada:</label>
        <textarea id="decoration" rows="4"></textarea>

        <!-- Visualização do Preço -->
        <p id="price">Preço: R$ <span id="price-value">0.00</span></p>

        <!-- Botão Finalizar Pedido -->
        <button onclick="finalizeOrder()">Finalizar Pedido</button>
    </section>

    <!-- Página de Confirmação do Pedido -->
    <section id="confirmation" style="display: none;">
        <h2>Confirmação do Pedido</h2>
        <div id="order-summary"></div>
        <h3>Informações de Contato</h3>
        <label for="name">Nome:</label>
        <input type="text" id="name">
        <label for="phone">Telefone:</label>
        <input type="text" id="phone">
        <label for="address">Endereço:</label>
        <input type="text" id="address">
        <button id="confirma" onclick="submitOrder()">Confirmar e Enviar Pedido</button>
    </section>

    <!-- Página de Agradecimento -->
    <section id="thank-you" style="display: none;">
        <h2>Obrigado pelo seu Pedido!</h2>
        <p>Seu pedido foi recebido com sucesso. Em breve entraremos em contato.</p>
    </section>
</body>
</html>
